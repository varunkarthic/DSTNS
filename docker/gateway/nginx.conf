events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # The engine serves the observer and the API from one port.
  upstream dstns { server dstns:8090; }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/dstns.crt;
    ssl_certificate_key /etc/nginx/certs/dstns.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Compressed topology for a large district can run to several megabytes.
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    # The engine refuses state-changing requests whose Origin is not the host
    # they were addressed to, so it must see the host the browser used.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    location = /health/engine { proxy_pass http://dstns/health; }
    location / { proxy_pass http://dstns; }
  }
}
