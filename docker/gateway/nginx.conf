events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream engine { server engine:8090; }
  upstream ui { server ui:4173; }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/dstns.crt;
    ssl_certificate_key /etc/nginx/certs/dstns.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/v1/ui-overlay/ { proxy_pass http://ui; proxy_http_version 1.1; proxy_buffering off; proxy_set_header Connection $connection_upgrade; proxy_set_header Upgrade $http_upgrade; }
    location /api/ { proxy_pass http://engine; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 1h; proxy_set_header Connection $connection_upgrade; proxy_set_header Upgrade $http_upgrade; }
    location /health/engine { proxy_pass http://engine/health; }
    location / { proxy_pass http://ui; proxy_http_version 1.1; }
  }
}
