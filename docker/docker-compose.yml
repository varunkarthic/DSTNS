services:
  engine:
    build: {context: .., dockerfile: Dockerfile}
    platform: linux/amd64
    restart: "no"
    volumes: ["../logs:/app/logs", "../data:/app/data"]
    networks: [dstns]
  ui:
    build: {context: ../ui-engine, dockerfile: Dockerfile}
    restart: "no"
    depends_on: {engine: {condition: service_healthy}}
    networks: [dstns]
  gateway:
    build: {context: gateway, dockerfile: Dockerfile}
    restart: "no"
    depends_on: {engine: {condition: service_healthy}, ui: {condition: service_healthy}}
    ports: ["8443:8443"]
    volumes: ["./certificates:/etc/nginx/certs"]
    networks: [dstns]
networks: {dstns: {driver: bridge}}
