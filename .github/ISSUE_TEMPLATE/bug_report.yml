name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a **security vulnerability**, stop and follow
        [SECURITY.md](../blob/main/SECURITY.md) instead; do not post details here.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the seed, day type and the exact command or request.
      placeholder: |
        1. ./launcher start --seed 382923
        2. Seek to 08:00:00
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse HEAD` and `./build/dstns_server --version`, or the Docker image digest.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run DSTNS
      options: [Docker, From source (macOS), From source (Linux), From source (WSL 2), Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines of `logs/system.log` or the browser console. Remove secrets and tokens.
      render: text
