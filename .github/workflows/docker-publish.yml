name: Build and Publish Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Serialize promotions so two builds cannot update the aliases simultaneously.
concurrency:
  group: container-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/varunkarthic/dstns

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      created: ${{ steps.identity.outputs.created }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - id: identity
        run: python3 scripts/image-metadata.py

  build:
    name: Build and exercise ${{ matrix.arch }}
    needs: metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Upload by digest only; no public release aliases move until all gates pass.
      - name: Build candidate with provenance and SBOM
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ needs.metadata.outputs.revision }}
            BUILD_DATE=${{ needs.metadata.outputs.created }}
            RELEASE_CHANNEL=${{ needs.metadata.outputs.channel }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Pull and test the exact candidate on its native architecture
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          python3 tests/docker/smoke.py "$IMAGE@$DIGEST" --arch '${{ matrix.arch }}' --revision '${{ needs.metadata.outputs.revision }}'
      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Promote tested multi-platform manifest
    needs: [checks, metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Generate tags and index annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=stable,enable=${{ needs.metadata.outputs.channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.channel == 'stable' }}
            type=raw,value=edge,enable=${{ needs.metadata.outputs.channel == 'edge' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=DSTNS
            org.opencontainers.image.description=Deterministic Spatiotemporal Transport Network Simulator
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.created }}
            org.opencontainers.image.authors=Varun Karthic (https://github.com/varunkarthic)
            org.opencontainers.image.vendor=Varun Karthic
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.documentation=https://dstns.readthedocs.io/
      - name: Assemble and verify the candidate index before assigning release tags
        env:
          META: ${{ steps.meta.outputs.json }}
        run: |
          python3 scripts/publish-image.py --digests /tmp/digests
