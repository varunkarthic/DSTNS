name: Build and Publish Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: varunkarthic/dstns

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # Enable Docker Buildx
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ------------------------------------------------------------
      # Authenticate with GitHub Container Registry
      # ------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Generate tags and OCI metadata
      # ------------------------------------------------------------
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            # main -> latest
            type=raw,value=latest,enable={{is_default_branch}}

            # v1.2.3 -> 1.2.3
            type=semver,pattern={{version}}

            # v1.2.3 -> 1.2
            type=semver,pattern={{major}}.{{minor}}

            # v1.2.3 -> 1
            type=semver,pattern={{major}}

            # Every build also gets its commit SHA
            type=sha,prefix=sha-

          labels: |
            org.opencontainers.image.title=DSTNS
            org.opencontainers.image.description=Deterministic Spatiotemporal Transport Network Simulator
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # ------------------------------------------------------------
      # Build and publish
      # ------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # GitHub Actions build cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

