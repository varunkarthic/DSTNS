# Continuous integration: the native and HTTP suites, the observer, the
# documentation (as Read the Docs builds it) and the container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core (C++ and HTTP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev zlib1g-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-engine/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No shader compiler on this runner: the build must succeed from the
      # committed SPIR-V, and fails here if shaders/spirv/ is older than the
      # GLSL it was compiled from.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDSTNS_BUILD_TESTS=ON -DDSTNS_BUILD_SHADERS=OFF -DDSTNS_VULKAN_REQUIRED=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Native and HTTP suites
        run: ctest --test-dir build --output-on-failure
      - name: API smoke test
        run: python3 tests/api/api_smoke.py --server build/dstns_server
      - name: Launcher suites without the terminal interface (compatibility mode)
        run: |
          python3 tests/launcher/test_core.py
          python3 tests/launcher/test_compute.py
          python3 tests/launcher/test_interfaces.py
      - name: Launcher suites with the terminal interface
        run: |
          python3 -m pip install --disable-pip-version-check -q -r dstns_launcher/requirements.txt
          python3 tests/launcher/test_interfaces.py
      - name: CLI suites
        run: |
          python3 tests/cli/test_fetch_osm.py
          python3 tests/cli/test_fetch_dem.py
          python3 tests/cli/test_seeds.py
      - name: Replay verification
        run: ./build/dstns_replay_verify 382923
      - name: Licence headers
        run: python3 scripts/license-headers.py --check

  vulkan:
    name: Vulkan compute (software device, validation layers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Mesa's llvmpipe is a conformant Vulkan implementation on the CPU: it has
      # no GPU's speed, but it runs every kernel, so CPU/Vulkan equivalence and
      # the validation layers are checked on every change.
      - name: Install Vulkan loader, llvmpipe, validation layers and glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev zlib1g-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools glslang-tools
      - name: Configure (Vulkan required, shaders compiled from GLSL)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDSTNS_BUILD_TESTS=ON -DDSTNS_VULKAN_REQUIRED=ON
      - name: Build
        run: cmake --build build -j"$(nproc)" --target dstns_server dstns_compute_equivalence_tests dstns_engine_compute_tests dstns_field_tests dstns_benchmark
      - name: GPU diagnostics
        run: ./build/dstns_server --gpu-diagnostics --allow-software-vulkan
      - name: CPU and Vulkan equivalence, under validation
        env:
          DSTNS_VULKAN_VALIDATION: "1"
        run: ./build/dstns_compute_equivalence_tests
      - name: The engine on Vulkan
        run: ./build/dstns_engine_compute_tests
      - name: Structured-grid field kernels, under validation
        env:
          DSTNS_VULKAN_VALIDATION: "1"
        run: ./build/dstns_field_tests
      - name: Compute benchmark (software device; correctness of the tool, not speed)
        run: ./build/dstns_benchmark compute --sizes 1000,10000 --device llvmpipe --replay-steps 50

  observer:
    name: Observer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-engine/package-lock.json
      - run: npm ci
        working-directory: ui-engine
      - name: Type check
        run: npx tsc -b
        working-directory: ui-engine
      - name: Tests
        run: npm test
        working-directory: ui-engine
      - name: Production build
        run: npm run build
        working-directory: ui-engine

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt openapi-spec-validator
      - name: Build (strict, as Read the Docs does)
        run: mkdocs build --strict
      - name: Validate OpenAPI description
        run: |
          python3 -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('docs/api/openapi.yaml'))); print('openapi.yaml is valid')"

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t dstns:ci .
      - name: Start with the bundled map and wait for a running simulation
        run: |
          docker run -d --name dstns -p 8090:8090 \
            -e DSTNS_SEED=382923 -e DSTNS_OSM_FILE=/app/data/fixtures/real_network.osm.xml dstns:ci
          for i in $(seq 1 60); do
            if curl -fs localhost:8090/api/v1/playback/status | grep -q '"RUNNING"'; then
              echo "simulation running"; docker logs dstns; exit 0
            fi
            sleep 2
          done
          docker logs dstns; exit 1
