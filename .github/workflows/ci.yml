# Continuous integration: the native and HTTP suites, the observer, the
# documentation (as Read the Docs builds it) and the container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core (C++ and HTTP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev zlib1g-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dstns-operator-cli/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDSTNS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Native and HTTP suites
        run: ctest --test-dir build --output-on-failure
      - name: API smoke test
        run: python3 tests/api/api_smoke.py --server build/dstns_server
      - name: Operator CLI dependencies
        run: npm ci --prefix dstns-operator-cli
      - name: CLI suites
        run: |
          python3 tests/cli/test_fetch_osm.py
          python3 tests/cli/test_seeds.py
          node --test tests/cli/*.test.mjs
      - name: Replay verification
        run: ./build/dstns_replay_verify 382923

  observer:
    name: Observer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-engine/package-lock.json
      - run: npm ci
        working-directory: ui-engine
      - name: Type check
        run: npx tsc -b
        working-directory: ui-engine
      - name: Tests
        run: npm test
        working-directory: ui-engine
      - name: Production build
        run: npm run build
        working-directory: ui-engine

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt openapi-spec-validator
      - name: Build (strict, as Read the Docs does)
        run: mkdocs build --strict
      - name: Validate OpenAPI description
        run: |
          python3 -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('docs/api/openapi.yaml'))); print('openapi.yaml is valid')"

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t dstns:ci .
      - name: Start with the bundled map and wait for a running simulation
        run: |
          docker run -d --name dstns -p 8090:8090 \
            -e DSTNS_SEED=382923 -e DSTNS_OSM_FILE=/app/data/fixtures/real_network.osm.xml dstns:ci
          for i in $(seq 1 60); do
            if curl -fs localhost:8090/api/v1/playback/status | grep -q '"RUNNING"'; then
              echo "simulation running"; docker logs dstns; exit 0
            fi
            sleep 2
          done
          docker logs dstns; exit 1
