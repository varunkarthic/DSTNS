# Continuous integration: the native and HTTP suites, the launcher, the observer, the
# documentation (as Read the Docs builds it) and the container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core (C++ and HTTP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev zlib1g-dev libcurl4-openssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebKit/package-lock.json
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDSTNS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Native and HTTP suites
        run: ctest --test-dir build --output-on-failure
      - name: Launcher suites
        run: |
          cargo test --release --manifest-path CoreAI/Cargo.toml
          cargo test --release --manifest-path LaunchKit/Cargo.toml
      - name: Replay verification
        run: ./build/dstns_replay_verify 382923
      - name: Licence headers
        run: ./build/dstns_release headers --check

  observer:
    name: Observer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebKit/package-lock.json
      - run: npm ci
        working-directory: WebKit
      - name: Type check
        run: npx tsc -b
        working-directory: WebKit
      - name: Tests
        run: npm test
        working-directory: WebKit
      - name: Production build
        run: npm run build
        working-directory: WebKit

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt openapi-spec-validator
      - name: Build (strict, as Read the Docs does)
        run: mkdocs build --strict
      - name: Validate OpenAPI description
        run: |
          python3 -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('docs/api/openapi.yaml'))); print('openapi.yaml is valid')"

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t dstns:ci .
      - name: Build the release tool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev zlib1g-dev libcurl4-openssl-dev
          cmake -S . -B build -DDSTNS_BUILD_TESTS=OFF && cmake --build build --target dstns_release -j"$(nproc)"
      - name: Exercise the packaged runtime
        run: ./build/dstns_release smoke dstns:ci --arch amd64
