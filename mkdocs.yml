# DSTNS documentation site. Built by Read the Docs (see .readthedocs.yaml),
# or locally:
#
#   python3 -m venv .venv-docs && .venv-docs/bin/pip install -r docs/requirements.txt
#   .venv-docs/bin/mkdocs serve          # http://127.0.0.1:8000, live reload
#   .venv-docs/bin/mkdocs build --strict # what CI and Read the Docs run

site_name: DSTNS
site_description: >-
  Deterministic Spatiotemporal Transport Network Simulator: a seeded,
  real-geography traffic simulator with a C++20 core, an operator CLI and a
  browser observer.
site_author: Varun Karthic
# Read the Docs sets the canonical URL of each version; the fallback is used
# for local builds.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://dstns.readthedocs.io/"]
repo_url: https://github.com/varunkarthic/DSTNS
repo_name: varunkarthic/DSTNS
exclude_docs: |
  includes/

copyright: Copyright &copy; 2026 Varun Karthic &middot; AGPL-3.0-or-later &middot; Map data &copy; OpenStreetMap contributors

theme:
  name: material
  custom_dir: docs/overrides
  # The wordmark is the whole brand in the header; the site name text is hidden
  # in extra.css so the logo is not repeated as plain type.
  logo: assets/logo-wordmark.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    close: material/close-circle
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

hooks:
  - hooks/cachebust.py

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/varunkarthic/DSTNS
      name: DSTNS on GitHub
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - assets/search-ui.js
  - assets/site.js
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - swagger-ui-tag:
      extra_css:
        - assets/swagger-dstns.css

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

