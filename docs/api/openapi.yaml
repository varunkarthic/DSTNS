      summary: Advance a fixed amount of virtual time and hold
      description: Needs the operator credential, or the observer. An application acts through `/api/v1/fabric/apps/{id}/control`
        instead.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  default: 60
      responses:
        '200':
          description: Stepped
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_seconds:
                    type: integer
                  simulated_seconds:
                    type: integer
                  stepped_seconds:
                    type: integer
                  target_time:
                    type: string
                    example: 06:01:00
                  lifecycle:
                    type: string
                    enum:
                    - PAUSED
                    - COMPLETED
                  playback_revision:
                    type: integer
                  state_revision:
                    type: integer
        '400':
          description: seconds outside 1 to 3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No active simulation, or the virtual day is already complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      security:
      - OperatorKey: []
      - ObserverHost: []
