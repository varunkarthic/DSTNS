openapi: 3.1.0
info:
  title: DSTNS API
  version: 1.4.0
  description: 'Deterministic Spatiotemporal Transport Network Simulator runtime API.


    Every read view returns the standard envelope (run_id, seed, state_revision, config_revision, clock,
    data). State-changing requests that carry a browser Origin header must come from the host they are
    sent to (or an origin in DSTNS_ALLOWED_ORIGINS), otherwise 403 CROSS_ORIGIN_FORBIDDEN. Starting a
    run requires the operator credential in X-DSTNS-Operator. Documentation: https://dstns.readthedocs.io/


    A request body may be up to 16 MiB, and JSON may nest up to 64 levels. For each route in prose, with
    real responses, see Every endpoint in the documentation.'
servers:
- url: http://127.0.0.1:8090
  description: Local C++ API server
tags:
- name: Daemons
  description: Watchers inside the server, and the queues everyone hears them on
- name: Playback
- name: View
- name: Control
- name: News
- name: System
- name: Fabric
  description: Applications that register themselves with this server.
paths:
  /health:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/status:
    get:
      tags:
      - Playback
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/terminate:
    post:
      tags:
      - System
      operationId: terminate
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/playback/status:
    get:
      tags:
      - Playback
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/status` instead.
      security: []
  /api/v1/playback/start:
    post:
      tags:
      - Playback
      operationId: startSimulation
      description: 'CLI operator startup; browser creation is forbidden.


        Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation` header.
        Use `/api/v1/fabric/engine/start` instead.'
      security:
      - OperatorKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
      responses:
        '403':
          $ref: '#/components/responses/Error'
        '202':
          description: Prepared and running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          description: MAP_FETCH_FAILED. The seed resolved to a real city district whose OpenStreetMap
            tile is not cached and could not be downloaded (offline, Overpass rate limiting, or an area
            too sparse to simulate). No scenario is compiled and no substitute map is used. The message
            names the city, the coordinates and the cause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
  /api/v1/playback/step:
    post:
      tags:
      - Playback
      operationId: stepPlayback
      summary: Advance a fixed amount of virtual time and hold
      description: 'Advances the model by exactly `seconds` of virtual time using the normal one-second
        physics, then leaves the run paused. A step that reaches 24:00:00 completes the run. Stepping
        and seeking to the same time produce identical state.


        Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation` header.
        Use `/api/v1/fabric/engine/step` instead.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  default: 60
      responses:
        '200':
          description: Stepped
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_seconds:
                    type: integer
                  simulated_seconds:
                    type: integer
                  stepped_seconds:
                    type: integer
                  target_time:
                    type: string
                    example: 06:01:00
                  lifecycle:
                    type: string
                    enum:
                    - PAUSED
                    - COMPLETED
                  playback_revision:
                    type: integer
                  state_revision:
                    type: integer
        '400':
          description: seconds outside 1 to 3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No active simulation, or the virtual day is already complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      security: []
  /api/v1/world/regenerate:
    post:
      tags:
      - World
      operationId: regenerateWorld
      summary: Replace the world with one from a fresh seed
      description: Accepted immediately; progress is reported by /api/v1/world/status. The seed comes
        from the secure generator and every other parameter is copied from the current run, so the caller
        chooses nothing about the new world. The current world keeps running until the new one is installed
        and is unchanged if generation fails. The new world starts paused at 00:00:00. Disabled with DSTNS_DISABLE_WORLD_REGENERATION=1.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_run_id:
                  type: string
                  description: Cancel with 409 if the active run is no longer this one.
                stage:
                  type: boolean
                  description: Prepare the new world without replacing the current one, which keeps running. It
                    waits in state `staged` until /api/v1/world/regenerate/commit puts it in or /api/v1/world/regenerate/discard
                    forgets it. The observer asks for this the moment a person asks for a new world, before they confirm.
      responses:
        '202':
          description: Generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                  data:
                    $ref: '#/components/schemas/WorldStatus'
        '403':
          description: Regeneration disabled by the operator (WORLD_REGENERATION_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No active world, a generation already in progress, or a stale run guard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/world/regenerate/commit:
    post:
      tags:
      - World
      operationId: commitWorld
      summary: Put in the world prepared with stage
      description: Installs the staged world at once, or, if it is still being prepared, as soon as it is ready. Like
        any new world it starts paused at 00:00:00.
      responses:
        '202':
          description: Installed, or to be installed when ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                  data:
                    $ref: '#/components/schemas/WorldStatus'
        '403':
          description: Regeneration disabled by the operator (WORLD_REGENERATION_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No world is waiting to be confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/world/regenerate/discard:
    post:
      tags:
      - World
      operationId: discardWorld
      summary: Forget the world prepared with stage
      description: A world still being prepared finishes and is dropped. The current world is untouched. Discarding
        when nothing is staged does nothing.
      responses:
        '200':
          description: The world job, now idle
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                  data:
                    $ref: '#/components/schemas/WorldStatus'
  /api/v1/world/status:
    get:
      tags:
      - World
      operationId: worldStatus
      summary: Progress of the current or last world generation
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                  data:
                    $ref: '#/components/schemas/WorldStatus'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/backpressure:
    get:
      tags:
      - System
      operationId: backpressureStatus
      summary: Current Adaptive Simulation Backpressure state
      description: Read the backpressure state without reporting anything. Includes the measured snapshot
        and byte delivery rate. See docs/asb.md.
      responses:
        '200':
          description: Backpressure state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backpressure'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
    post:
      tags:
      - System
      operationId: reportBackpressure
      summary: Report observer health and receive the resulting governance
      description: 'The observer reports how far behind it is; the response is the authoritative backpressure
        state, so one round trip both informs and instructs. Reporting is presentation-side only: it changes
        the rate at which virtual time advances, never what the simulation computes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                virtual_lag_s:
                  type: number
                  minimum: 0
                  description: Virtual seconds between the rendered snapshot and the core's state.
                client_frame_s:
                  type: number
                  minimum: 0
                  description: Wall-clock seconds between the observer's own frames.
                since_poll_s:
                  type: number
                  minimum: 0
                  description: Seconds since the observer last polled.
      responses:
        '200':
          description: Backpressure state after this report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backpressure'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/observer:
    post:
      tags:
      - System
      summary: An open observer reports whether a finishing world should wait for it
      description: A run that finishes preparing while this is true stays at its first second, with observer_hold
        true in the playback status, until it is false or 4 seconds pass without a report. A client that
        never calls this is never waited for.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                waiting:
                  type: boolean
      responses:
        '200':
          description: The observer's state as the engine sees it
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                  data:
                    type: object
                    properties:
                      waiting:
                        type: boolean
                      hold:
                        type: boolean
                      lifecycle:
                        type: string
        4XX:
          $ref: '#/components/responses/Error'
      security: []
    get:
      tags:
      - System
      summary: Whether the observer page has been served in a browser yet
      responses:
        '200':
          description: Observer load count
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    const: '1.0'
                  data:
                    type: object
                    properties:
                      loaded:
                        type: boolean
                      loads:
                        type: integer
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/map-status:
    get:
      tags:
      - System
      operationId: mapStatus
      summary: Progress of a map download in flight
      description: Observational only. Reports the city, phase and byte progress of a district download
        so the CLI and the splash screen can show it.
      responses:
        '200':
          description: Download progress, or an inactive report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      active:
                        type: boolean
                      city:
                        type: string
                      country:
                        type: string
                      phase:
                        type: string
                        enum:
                        - connect
                        - download
                        - parse
                        - retry
                      bytes:
                        type: integer
                      total:
                        type: integer
                        description: 0 when Overpass sent no Content-Length.
                      elapsed_s:
                        type: number
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/narrator:
    get:
      tags:
      - System
      operationId: narratorStatus
      summary: Narration model, queue and cache
      description: Presentation only. Reports the language-model backend (Apple Foundation Models via
        fm serve, or a Chat Completions endpoint), its queue, guardrail refusals and the narration cache.
      responses:
        '200':
          description: Narrator status, or {"enabled":false,"state":"off"} without a narrator
          content:
            application/json:
              schema:
                type: object
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/ui-config:
    get:
      tags:
      - System
      operationId: uiConfig
      summary: Observer presentation defaults
      description: Serves config/ui-config.json. Presentation only; see docs/ui-configuration.md. A malformed
        file yields UI_CONFIG_INVALID and the observer falls back to its built-in defaults.
      responses:
        '200':
          description: Configuration, or an empty object when none is installed
          content:
            application/json:
              schema:
                type: object
        '500':
          $ref: '#/components/responses/Error'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/system/source:
    get:
      tags:
      - System
      operationId: sourceOffer
      summary: Licence and corresponding-source offer
      description: GNU AGPL section 13. Because this program is offered over a network, every user interacting
        with it must be told where to obtain the corresponding source of the version they are running.
      responses:
        '200':
          description: Programme, version, licence and source offer
          content:
            application/json:
              schema:
                type: object
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/playback/pause:
    post:
      tags:
      - Playback
      operationId: pause
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/pause` instead.
      requestBody:
        required: false
        content:
          application/json:
            schema: &id001
              type: object
              properties:
                expected_playback_revision:
                  type: integer
                  minimum: 0
                  description: 'Only act if nobody else has changed playback since. If they have: 409.'
      security: []
  /api/v1/playback/play:
    post:
      tags:
      - Playback
      operationId: play
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/play` instead.
      requestBody:
        required: false
        content:
          application/json:
            schema: *id001
      security: []
  /api/v1/playback/stop:
    post:
      tags:
      - Playback
      operationId: stop
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/stop` instead.
      security: []
  /api/v1/playback/reset:
    post:
      tags:
      - Playback
      operationId: reset
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/reset` instead.
      security: []
  /api/v1/playback/seek:
    post:
      tags:
      - Playback
      operationId: seek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_time
              properties:
                target_time:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
                play:
                  type: boolean
                  default: false
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/seek` instead.
      security: []
  /api/v1/control/tick-rate:
    put:
      tags:
      - Control
      operationId: setTickRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tick_rate
              properties:
                tick_rate:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 10
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/tick-rate` instead.
      security: []
  /api/v1/control/day:
    post:
      tags:
      - Control
      operationId: setDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - day
              properties:
                day:
                  type: integer
                  enum:
                  - 0
                  - 1
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/day` instead.
      security: []
  /api/v1/control/modules/{module}:
    put:
      tags:
      - Control
      operationId: setModule
      parameters:
      - $ref: '#/components/parameters/Module'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/modules/{module}` instead.
      security: []
  /api/v1/control/events/weather:
    post:
      tags:
      - Control
      operationId: addWeather
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherRequest'
      responses:
        '202':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/events/weather` instead.
      security: []
  /api/v1/control/events/traffic:
    post:
      tags:
      - Control
      operationId: addTraffic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficRequest'
      responses:
        '202':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/events/traffic` instead.
      security: []
  /api/v1/control/edges/{id}/override:
    post:
      tags:
      - Control
      operationId: overrideEdge
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeOverride'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/edges/{id}/override` instead.
      security: []
  /api/v1/control/undo:
    post:
      tags:
      - Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryCount'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/undo` instead.
      security: []
  /api/v1/control/redo:
    post:
      tags:
      - Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryCount'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/redo` instead.
      security: []
  /api/v1/control/history:
    get:
      tags:
      - Control
      operationId: history
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
        4XX:
          $ref: '#/components/responses/Error'
      deprecated: true
      description: Legacy. This still works, and its response carries a `legacy` notice with a `Deprecation`
        header. Use `/api/v1/fabric/engine/history` instead.
      security: []
  /api/v1/view/run:
    get:
      tags:
      - Playback
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
        4XX:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/view/manifest:
    get:
      tags:
      - View
      operationId: manifest
      responses:
