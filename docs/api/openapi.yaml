components:
  securitySchemes:
    OperatorKey:
      type: apiKey
      in: header
      name: X-DSTNS-Operator
    AppToken:
      type: http
      scheme: bearer
      description: 'An application''s token, from registering. Sign requests too if the application requires
        it: see docs/api/security.md.'
    ObserverHost:
      type: apiKey
      in: header
      name: X-DSTNS-Host
      description: Sent by the observer. A browser page from another origin can't use it, but a local
        program can.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    Module:
      name: module
      in: path
      required: true
      schema:
        type: string
        enum:
        - traffic
        - signals
        - buildings
        - dws
        - flooding
        - news
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 250
    SinceNews:
      name: since_news_id
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    WorldStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - idle
          - generating
          - staged
          - ready
          - failed
        stage:
          type: string
          enum:
          - idle
          - staged
          - compiling
          - requesting
          - downloading
          - validating
          - building
          - installing
          - ready
          - failed
          description: Map stages are reported by the live downloader, not estimated.
        seed:
          type: string
          description: The new world's seed
          known as soon as the job starts.: null
        previous_run_id:
          type: string
        run_id:
          type: string
          description: The installed world
          once ready.: null
        generation:
          type: integer
        elapsed_s:
          type: number
        enabled:
          type: boolean
        map:
          nullable: true
          type: object
          properties:
            city:
              type: string
            country:
              type: string
            phase:
              type: string
            bytes:
              type: integer
            total:
              type: integer
              description: 0 when the size is not known.
            elapsed_s:
              type: number
        error:
          nullable: true
          type: object
          properties:
            code:
              type: string
              enum:
              - MAP_FETCH_FAILED
              - WORLD_GENERATION_FAILED
              - TERMINATING
            message:
              type: string
        eta_s:
          nullable: true
          type: number
          description: Seconds until the new world is ready, as the server estimates it, while it is generating.
        eta_confident:
          type: boolean
          description: Whether eta_s rests on something measured (a download of known size, a city on disk, the
            build itself) rather than on how long the last ones took.
        next:
          type: object
          description: 'Dynamic Fastboot: the world after this one, chosen while this one runs, and whether its city
            is on disk yet.'
          properties:
            enabled:
              type: boolean
            state:
              type: string
              enum:
              - idle
              - fetching
              - ready
              - failed
              - 'off'
            seed:
              type: string
            city:
              type: string
            country:
              type: string
            error:
              type: string
    Health:
      type: object
      required:
      - ok
      - product
      - lifecycle
      properties:
        ok:
          type: boolean
        product:
          const: DSTNS
        lifecycle:
          type: string
    Clock:
      type: object
      required:
      - playback_state
      - simulated_current_time
      - virtual_day_seconds
      - simulation_percentage
      - tick_rate
      properties:
        playback_state:
          type: string
        simulated_current_time:
          type: string
        virtual_day_seconds:
          type: integer
        simulation_percentage:
          type: number
        playback_duration_seconds:
          type: integer
        base_rate:
          type: number
        tick_rate:
          type: number
        target_virtual_rate:
          type: number
    Envelope:
      type: object
      required:
      - api_version
      - run_id
      - seed
      - global_seed
      - state_revision
      - config_revision
      - clock
      - data
      properties:
        api_version:
          const: '1.0'
        run_id:
          type: string
        seed:
          type: string
          description: 'The run''s seed as a decimal integer: the number that started it and the name
            it is known by in the interface, the CLI and reports.'
          pattern: ^[0-9]{1,39}$
          example: '17310766248549826767'
        global_seed:
          type: string
          description: The same value in the core's internal 128-bit hexadecimal form, used for hashing
            and sub-seed derivation.
          example: '0x0000000000000000f02b5a3a1c2d4e8f'
        state_revision:
          type: integer
        config_revision:
          type: integer
        clock:
          $ref: '#/components/schemas/Clock'
        data: {}
    Error:
      type: object
      required:
      - api_version
      - error
      properties:
        api_version:
          const: '1.0'
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    StartRequest:
      type: object
      properties:
        seed:
          oneOf:
          - type: string
            pattern: ^0x[0-9a-fA-F]{1,32}$
          - type: integer
            minimum: 0
        playback_duration_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 3600
        start_virtual_time:
          type: string
          default: 00:00:00
        tick_rate:
          type: number
          description: Playback multiplier; the interface offers 0.25 to 10.
          exclusiveMinimum: 0
          maximum: 10
          default: 1
        saved_seed_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
        map_selection_version:
          type: string
          const: urban-crfg-v3
        day:
          default: 0
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - const: auto
        modules:
          type: object
          additionalProperties:
            type: boolean
        dws:
          type: object
          properties:
            frequency:
              type: integer
              minimum: 0
        map:
          type: object
          properties:
            osm_file:
              type: string
              default: auto
              description: Path to an OSM XML file, or "auto" (the default) to let the seed select a real
                city district that is downloaded from OpenStreetMap on demand and cached under map.cache_dir.
                Regenerating the graph with a different seed names a different tile and therefore requires
                a new download; an identical seed reuses the cache.
            max_nodes:
              type: integer
              minimum: 2
              maximum: 50000
            tile_radius_m:
              type: number
              exclusiveMinimum: 0
              maximum: 20000
              default: 2000
              description: Half-extent in true metres of the tile downloaded around the seed-derived anchor.
            cache_dir:
              type: string
              default: data/maps
              description: Directory holding downloaded tiles, keyed by city and anchor.
    Backpressure:
      type: object
      required:
      - state
      - score
      - synced
      - gui_suspended
      - applied_tick_rate
      - throughput
      - actions
      properties:
        state:
          type: string
          enum:
          - NORMAL
          - RESTRICTED
          - ASYNC
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Normalized backpressure; the worst of lag, frame cost and poll silence.
        synced:
          type: boolean
        rate_locked:
          type: boolean
          description: True outside NORMAL, where the multiplier is pinned at 1x.
        motion_locked:
          type: boolean
          description: True outside NORMAL, where reduced motion is forced on.
        gui_suspended:
          type: boolean
          description: True in ASYNC. The simulation continues; only the interface is stood down.
        rate_capped:
          type: boolean
          description: Whether ASB is imposing a ceiling on the multiplier at all.
        rate_cap:
          type: number
          description: The ceiling in force, or -1 when none is (JSON has no infinity).
        applied_tick_rate:
          type: number
          description: What the simulation is actually running at.
        requested_tick_rate:
          type: number
          description: What the operator asked for. Retained and restored on recovery.
        stressed_for_s:
          type: number
        state_for_s:
          type: number
        throughput:
          type: object
          properties:
            snapshots_per_s:
              type: number
            bytes_per_s:
              type: number
        actions:
          type: array
          description: The last 24 transitions, each with a plain-language reason.
          items:
            type: object
            properties:
              at_s:
                type: number
              action:
                type: string
                enum:
                - throttle
                - default_state
                - restrict
                - suspend
                - release
              reason:
                type: string
              score:
                type: number
              rate_before:
                type: number
              rate_after:
                type: number
        thresholds:
          type: object
          additionalProperties:
            type: number
    StartResponse:
      type: object
      required:
      - ok
      - run_id
      - seed
      - lifecycle
      - resolved_config
      - stream
      properties:
        ok:
          type: boolean
        message:
          type: string
        run_id:
          type: string
        seed:
          type: string
        lifecycle:
          type: string
        resolved_config:
          type: object
        stream:
          type: object
    WeatherRequest:
      type: object
      required:
      - epicenter_node
      - intensity
      - radius_m
      - duration_virtual_minutes
      properties:
        epicenter_node:
          type: integer
          minimum: 0
        intensity:
          type: number
          minimum: 0
          maximum: 1
        radius_m:
          type: number
          exclusiveMinimum: 0
        duration_virtual_minutes:
          type: integer
          minimum: 1
        flood_gain:
          type: number
          minimum: 0
          maximum: 1
    TrafficRequest:
      type: object
      required:
      - target
      - congestion_pressure
      properties:
        target:
          type: object
          required:
          - type
          - id
          properties:
            type:
              const: edge
            id:
              type: integer
              minimum: 0
        congestion_pressure:
          type: number
          minimum: 0
          maximum: 1
    EdgeOverride:
      type: object
      properties:
        speed_multiplier:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        capacity_multiplier:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        closed:
          type: boolean
          default: false
    HistoryCount:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
    SurgeRequest:
      type: object
      required:
      - node_id
      properties:
        node_id:
          type: integer
          minimum: 0
        factor:
          type: number
          exclusiveMinimum: 0
          maximum: 10
          default: 1.8
        radius_m:
          type: number
          exclusiveMinimum: 0
          maximum: 20000
          default: 350
        duration_s:
          type: integer
          minimum: 1
          maximum: 86400
          default: 1800
    SumoRequest:
      type: object
      properties:
        directory:
          type: string
          default: data/sumo_run
        begin_s:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
        end_s:
          type: integer
          minimum: 1
          maximum: 86400
          default: 3600
          description: Must be greater than begin_s
  responses:
    Ok:
      description: Successful command
      content:
        application/json:
          schema:
            type: object
    Envelope:
      description: Revisioned JSON envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: CLI_START_REQUIRED, CROSS_ORIGIN_FORBIDDEN or WORLD_REGENERATION_DISABLED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
