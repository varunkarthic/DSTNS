# DSTNS with Docker Compose. See https://dstns.readthedocs.io/deployment/docker/.
#
#   docker compose up -d --pull always        # GHCR stable, http://localhost:8090
#   docker compose --profile tls up -d        # also https://localhost:8443
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Configure the first run with environment variables (or a .env file):
#   DSTNS_SEED=382923 DSTNS_DAY_TYPE=weekend docker compose up
# Start another run without restarting the container:
#   docker compose exec dstns dstns-run --seed 42

services:
  dstns:
    image: "${DSTNS_IMAGE:-ghcr.io/varunkarthic/dstns:stable}"
    restart: unless-stopped
    ports:
      # Loopback by default: the API can drive the run, so it is not published
      # to the network unless DSTNS_BIND says so (DSTNS_BIND=0.0.0.0).
      - "${DSTNS_BIND:-127.0.0.1}:${DSTNS_HOST_PORT:-8090}:8090"
    environment:
      DSTNS_AUTOSTART: "${DSTNS_AUTOSTART:-1}"
      DSTNS_SEED: "${DSTNS_SEED:-auto}"
      DSTNS_DAY_TYPE: "${DSTNS_DAY_TYPE:-weekday}"
      DSTNS_SPEED: "${DSTNS_SPEED:-1}"
      DSTNS_DURATION: "${DSTNS_DURATION:-3600}"
      DSTNS_OSM_FILE: "${DSTNS_OSM_FILE:-auto}"
      DSTNS_MAP_CACHE: "${DSTNS_MAP_CACHE:-prune}"
      DSTNS_MAP_CACHE_KEEP: "${DSTNS_MAP_CACHE_KEEP:-3}"
      DSTNS_DISABLE_WORLD_REGENERATION: "${DSTNS_DISABLE_WORLD_REGENERATION:-0}"
      DSTNS_ALLOWED_ORIGINS: "${DSTNS_ALLOWED_ORIGINS:-}"
      DSTNS_ALLOWED_HOSTS: "${DSTNS_ALLOWED_HOSTS:-}"
      DSTNS_OVERPASS_ENDPOINTS: "${DSTNS_OVERPASS_ENDPOINTS:-}"
    volumes:
      - dstns-maps:/app/data/maps   # downloaded city extracts survive restarts
      - dstns-logs:/app/logs        # system log, SQLite journal, operator token

  # Optional HTTPS front end. Generates a self-signed certificate on first
  # start unless docker/certificates/dstns.crt and dstns.key exist.
  gateway:
    profiles: ["tls"]
    build: docker/gateway
    restart: unless-stopped
    depends_on:
      dstns:
        condition: service_healthy
    ports:
      - "${DSTNS_BIND:-127.0.0.1}:${DSTNS_TLS_PORT:-8443}:8443"
    volumes:
      - ./docker/certificates:/etc/nginx/certs

volumes:
  dstns-maps:
  dstns-logs:
