[package]
name = "dstns-coreai"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "DSTNS's shared AI layer: one way to reach on-device and cloud models, for the launcher, the engine's news and the observer."
license = "AGPL-3.0-or-later"
authors = ["Varun Karthic"]
repository = "https://github.com/varunkarthic/DSTNS"

[lib]
name = "coreai"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
getrandom = "0.3"
